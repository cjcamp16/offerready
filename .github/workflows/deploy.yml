name: Deploy site to GitHub Pages

# Deterministic replacement for the legacy Jekyll builder, which repeatedly
# built the wrong commit / silently no-op'd. This publishes the exact pushed
# commit and fails loudly if anything goes wrong.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never run two deploys at once; let an in-flight one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site (static files, no Jekyll build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
